<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dot Field</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="playground">
    <div id="map" aria-label="Interactive geographic weather map"></div>

    <a class="maptiler-logo" href="https://www.maptiler.com/" target="_blank" rel="noopener noreferrer">
      <img src="https://api.maptiler.com/resources/logo.svg" alt="MapTiler">
    </a>

    <div class="scene-motion-controls">
      <button id="autoRotate" class="auto-rotate" type="button" aria-label="Enable auto rotation" aria-pressed="false">○</button>
      <label class="rain-speed-control">
        <input id="rainSpeed" type="range" min="0" max="4" step="0.01" value="2" aria-label="Rain fall speed">
      </label>
    </div>

    <div class="zoom-controls" role="group" aria-label="Map controls">
      <button id="resetView" class="zoom-reset" type="button" aria-label="Reset view" hidden>↺</button>
      <div class="zoom-stepper">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      </div>
    </div>

  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
