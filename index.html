<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixed-grid weather field</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="playground">
    <canvas id="field" aria-label="Animated fixed-grid rain, thunderstorm, and hail intensity field"></canvas>

    <div class="legend" aria-hidden="true">
      <span class="rain"><i class="rain-base"></i><i class="rain-strong"></i>Rain</span>
      <span class="storm"><i></i>Thunderstorm</span>
      <span class="hail"><i></i>Hail</span>
    </div>

    <div id="renderModeSelector" class="render-mode" role="radiogroup" aria-label="Weather rendering mode" data-mode="dots">
      <button type="button" role="radio" aria-checked="true" data-render-mode="dots">Dots</button>
      <button type="button" role="radio" aria-checked="false" data-render-mode="squares">Squares</button>
      <button type="button" role="radio" aria-checked="false" data-render-mode="areas">Areas</button>
      <button type="button" role="radio" aria-checked="false" data-render-mode="blur">Blur</button>
    </div>

    <section id="squaresRainTuning" class="squares-tuning" aria-label="Squares color tuning" hidden>
      <label class="squares-tuning-control">
        <span>Squares boundary rain brightness <output id="squaresBoundaryRainBrightnessValue">0.00</output></span>
        <input id="squaresBoundaryRainBrightness" type="range" min="0" max="0.3" step="0.01" value="0.00" aria-label="Squares boundary rain brightness">
      </label>
      <label class="squares-tuning-control">
        <span>Strong boundary mix <output id="squaresStrongBoundaryMixValue">0.00</output></span>
        <input id="squaresStrongBoundaryMix" type="range" min="0" max="1" step="0.05" value="0.00" aria-label="Strong boundary mix">
      </label>
      <label class="squares-tuning-control">
        <span>Storm boundary mix <output id="squaresStormBoundaryMixValue">0.45</output></span>
        <input id="squaresStormBoundaryMix" type="range" min="0" max="1" step="0.05" value="0.45" aria-label="Storm boundary mix">
      </label>
      <label class="squares-tuning-control">
        <span>Hail boundary mix <output id="squaresHailBoundaryMixValue">0.50</output></span>
        <input id="squaresHailBoundaryMix" type="range" min="0" max="1" step="0.05" value="0.50" aria-label="Hail boundary mix">
      </label>
    </section>

    <div class="readout" aria-live="polite">
      <span>zoom <b id="zoomLabel">1.00×</b></span>
      <span>LOD <b id="lodLabel">0</b></span>
    </div>

    <div class="zoom-controls" role="group" aria-label="Zoom controls">
      <button id="resetZoom" class="zoom-reset" type="button" aria-label="Reset zoom" hidden>↺</button>
      <div class="zoom-stepper">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      </div>
    </div>

    <section class="controls" aria-label="Playback and timeline controls">
      <button id="playPause" type="button" data-state="playing" aria-label="Pause"></button>
      <label class="time-control">
        <input id="timeSlider" type="range" min="0" max="1000" step="1" value="0" aria-label="Animation time">
      </label>
    </section>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
