<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dot Field</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="playground">
    <div id="map" aria-label="Interactive geographic weather map"></div>

    <a class="maptiler-logo" href="https://www.maptiler.com/" target="_blank" rel="noopener noreferrer">
      <img src="https://api.maptiler.com/resources/logo.svg" alt="MapTiler">
    </a>

    <div id="lodDiagnostics" class="lod-diagnostics" aria-live="polite">Zoom 5.80 · LOD —</div>

    <div id="rawTooltip" class="raw-tooltip" hidden role="status" aria-live="polite">
      <div id="rawTooltipContent"></div>
    </div>

    <div class="render-mode-controls">
      <div id="renderModeSelector" class="render-mode" role="radiogroup" aria-label="Weather rendering mode" data-mode="raw">
        <button type="button" role="radio" aria-checked="true" data-render-mode="raw">RAW</button>
        <button type="button" role="radio" aria-checked="false" data-render-mode="dots">Dots</button>
        <button type="button" role="radio" aria-checked="false" data-render-mode="squares">Squares</button>
        <button type="button" role="radio" aria-checked="false" data-render-mode="blur">Blur</button>
        <button type="button" role="radio" aria-checked="false" data-render-mode="areas">Areas</button>
      </div>
      <label id="rawPhenomenaControl" class="area-smooth raw-phenomena">
        <span class="area-smooth-content">
          <input id="rawPhenomena" type="checkbox" checked>
          <span>Hazards</span>
        </span>
      </label>
      <label id="areaSmoothControl" class="area-smooth" hidden>
        <span class="area-smooth-content">
          <input id="areaSmooth" type="checkbox">
          <span>Smooth</span>
        </span>
      </label>
    </div>

    <div class="zoom-controls" role="group" aria-label="Map controls">
      <button id="resetView" class="zoom-reset" type="button" aria-label="Reset view" hidden>↺</button>
      <div class="zoom-stepper">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      </div>
    </div>

    <section class="controls" aria-label="Playback and timeline controls">
      <button id="playPause" type="button" data-state="paused" aria-label="Play"></button>
      <label class="time-control">
        <input id="timeSlider" type="range" min="0" max="1" step="any" value="0" aria-label="Animation time">
      </label>
    </section>

  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
