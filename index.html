<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dot Field</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="playground">
    <div id="map" aria-label="Interactive geographic weather map"></div>

    <a class="maptiler-logo" href="https://www.maptiler.com/" target="_blank" rel="noopener noreferrer">
      <img src="https://api.maptiler.com/resources/logo.svg" alt="MapTiler">
    </a>

    <div class="scene-motion-controls">
      <button id="autoRotate" class="auto-rotate" type="button" aria-label="Enable auto rotation" aria-pressed="false">○</button>
      <label class="rain-speed-control">
        <input id="rainSpeed" type="range" min="0" max="4" step="0.01" value="2" aria-label="Rain fall speed">
      </label>
    </div>

    <section class="rain-tuning-panel" aria-label="Rain tuning">
      <div class="rain-tuning-title">Rain</div>
      <label class="rain-tuning-row" for="rainMinSize">
        <span>Min size</span>
        <input id="rainMinSize" type="range" min="0.08" max="0.30" step="0.01" value="0.18">
        <output id="rainMinSizeValue" for="rainMinSize">0.18</output>
      </label>
      <label class="rain-tuning-row" for="rainMaxSize">
        <span>Max size</span>
        <input id="rainMaxSize" type="range" min="0.20" max="0.50" step="0.01" value="0.32">
        <output id="rainMaxSizeValue" for="rainMaxSize">0.32</output>
      </label>
      <label class="rain-tuning-row" for="rainActivityContrast">
        <span>Contrast</span>
        <input id="rainActivityContrast" type="range" min="0.5" max="4.0" step="0.05" value="1.0">
        <output id="rainActivityContrastValue" for="rainActivityContrast">1.00</output>
      </label>
    </section>

    <div class="zoom-controls" role="group" aria-label="Map controls">
      <button id="resetView" class="zoom-reset" type="button" aria-label="Reset view" hidden>↺</button>
      <div class="zoom-stepper">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      </div>
    </div>

  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
