<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixed-grid weather field</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b12;
      color: #dce3f0;
      --control-panel: rgba(14, 19, 30, .88);
      --control-border: 1px solid rgba(176, 193, 220, .16);
      --control-radius: 12px;
      --control-inset-radius: 8px;
      --control-shadow: 0 8px 24px rgba(0, 0, 0, .28);
      --control-backdrop: blur(10px);
      --control-inset: #253149;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080b12;
    }

    body { display: grid; }

    .playground {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(22, 29, 45, 0.45), transparent 65%),
        #080b12;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .legend {
      position: absolute;
      top: 18px;
      left: 20px;
      display: flex;
      gap: 14px;
      align-items: center;
      pointer-events: none;
      color: #aeb9cb;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; display: block; }
    .rain-base { background: #0090FF; }
    .rain-strong { background: #0000FF; }
    .storm i {
      background: #FF00FF;
      clip-path: polygon(50% 0, 63.5% 36.5%, 100% 50%, 63.5% 63.5%, 50% 100%, 36.5% 63.5%, 0 50%, 36.5% 36.5%);
      transform: scale(1.18);
    }
    .hail i {
      background: #FFD400;
      clip-path: polygon(50% 0, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: calc(100% - 28px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: auto minmax(150px, 1fr);
      gap: 8px;
      align-items: center;
      padding: 4px;
      border: var(--control-border);
      border-radius: var(--control-radius);
      background: var(--control-panel);
      box-shadow: var(--control-shadow);
      backdrop-filter: var(--control-backdrop);
    }

    button {
      height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(176, 193, 220, .18);
      border-radius: 6px;
      background: #151b28;
      color: #e5ebf5;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover { background: #1c2434; border-color: rgba(176, 193, 220, .32); }
    button:active { transform: translateY(1px); }

    #playPause {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      border-radius: var(--control-inset-radius);
      background: var(--control-inset);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .28);
      display: grid;
      place-items: center;
    }

    #playPause:hover { border-color: transparent; background: #2d3a55; }

    #playPause::before { content: ''; display: block; }
    #playPause[data-state="playing"]::before {
      width: 10px;
      height: 12px;
      background: linear-gradient(to right, currentColor 0 3px, transparent 3px 7px, currentColor 7px 10px);
    }
    #playPause[data-state="paused"]::before {
      width: 0;
      height: 0;
      margin-left: 2px;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 10px solid currentColor;
    }

    .render-mode {
      position: absolute;
      left: 50%;
      bottom: 82px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 232px;
      height: auto;
      margin: 0;
      padding: 4px;
      border: var(--control-border);
      border-radius: var(--control-radius);
      background: var(--control-panel);
      color: #8794a9;
      font-size: 14px;
      box-shadow: var(--control-shadow);
      backdrop-filter: var(--control-backdrop);
      isolation: isolate;
      cursor: pointer;
    }

    .render-mode::before {
      content: '';
      position: absolute;
      z-index: -1;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      border-radius: var(--control-inset-radius);
      background: var(--control-inset);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .28);
      transition: transform 160ms ease;
    }

    .render-mode[aria-pressed="true"]::before {
      transform: translateX(100%);
    }

    .render-mode span {
      position: relative;
      display: block;
      padding: 10px 24px;
      border-radius: var(--control-inset-radius);
      text-align: center;
      transition: color 160ms ease;
    }

    .zoom-controls {
      position: absolute;
      bottom: 82px;
      right: 20px;
      display: grid;
      gap: 8px;
    }

    .zoom-stepper {
      display: grid;
      gap: 2px;
      padding: 4px;
      border: var(--control-border);
      border-radius: var(--control-radius);
      background: var(--control-panel);
      box-shadow: var(--control-shadow);
      backdrop-filter: var(--control-backdrop);
    }

    .zoom-stepper button {
      width: 44px;
      height: 42px;
      padding: 0;
      border: 0;
      border-radius: var(--control-inset-radius);
      outline: 0;
      box-shadow: none;
      background: transparent;
      font-size: 24px;
      line-height: 1;
    }

    .zoom-stepper button:hover,
    .zoom-stepper button:focus-visible,
    .zoom-stepper button:active { background: rgba(37, 49, 73, .72); }

    .zoom-reset {
      width: 42px;
      height: 42px;
      justify-self: end;
      padding: 0;
      border: var(--control-border);
      border-radius: var(--control-radius);
      background: var(--control-panel);
      font-size: 22px;
      line-height: 1;
      box-shadow: var(--control-shadow);
      backdrop-filter: var(--control-backdrop);
    }

    .zoom-reset[hidden] { display: none; }

    .render-mode span:first-child,
    .render-mode[aria-pressed="true"] span:last-child { color: #f1f5fb; }
    .render-mode[aria-pressed="true"] span:first-child { color: #8794a9; }
    .render-mode:hover span { color: #c7d0df; }
    .render-mode:focus-visible {
      outline: 2px solid #6aa6ff;
      outline-offset: 2px;
    }
    button.render-mode:active { transform: translateX(-50%); }

    .time-control {
      min-width: 0;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #6aa6ff;
      cursor: pointer;
    }

    .readout {
      position: absolute;
      top: 18px;
      right: 20px;
      display: flex;
      gap: 14px;
      color: #7f8da4;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      pointer-events: none;
    }

    .readout b { color: #dce3f0; font-weight: 500; }

    @media (max-width: 680px) {
      .controls {
        grid-template-columns: auto minmax(0, 1fr);
      }
      #playPause { grid-column: 1; grid-row: 1; }
      .time-control { grid-column: 2; grid-row: 1; }
      .zoom-controls { right: 14px; }
      .legend { gap: 9px; }
    }
  </style>
</head>
<body>
  <main class="playground">
    <canvas id="field" aria-label="Animated fixed-grid rain, thunderstorm, and hail intensity field"></canvas>

    <div class="legend" aria-hidden="true">
      <span class="rain"><i class="rain-base"></i><i class="rain-strong"></i>Rain</span>
      <span class="storm"><i></i>Thunderstorm</span>
      <span class="hail"><i></i>Hail</span>
    </div>

    <button id="renderModeToggle" class="render-mode" type="button" aria-label="Toggle weather rendering mode" aria-pressed="false">
      <span>Dots</span>
      <span>Blur</span>
    </button>

    <div class="readout" aria-live="polite">
      <span>zoom <b id="zoomLabel">1.00×</b></span>
      <span>LOD <b id="lodLabel">0</b></span>
    </div>

    <div class="zoom-controls" role="group" aria-label="Zoom controls">
      <button id="resetZoom" class="zoom-reset" type="button" aria-label="Reset zoom" hidden>↺</button>
      <div class="zoom-stepper">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      </div>
    </div>

    <section class="controls" aria-label="Playback and timeline controls">
      <button id="playPause" type="button" data-state="playing" aria-label="Pause"></button>
      <label class="time-control">
        <input id="timeSlider" type="range" min="0" max="1000" step="1" value="0" aria-label="Animation time">
      </label>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      // ── Configuration ────────────────────────────────────────────────────────
      const BASE_GRID = 128;           // Adjust underlying grid resolution here.
      const LOOP_SECONDS = 18;         // Adjust animation loop length / speed here.
      const MIN_ZOOM = 0.1;
      const MAX_ZOOM = 5.5;
      const TARGET_SPACING = 11.5;     // Desired approximate distance between dots in px.
      const LOD_MORPH_SECONDS = 0.2;   // Adjust geometric split / merge duration here.
      const GRID_OVERSCAN_CELLS = 4;   // Render fixed-grid samples beyond every viewport edge.
      const WEATHER_MARGIN_WORLD = 0.72; // Keeps the full system off-screen at loop endpoints.
      const RAIN_MODERATE_MAX = 0.55;
      const RAIN_BLUE = '#0090FF';
      const STRONG_PRECIPITATION_BLUE = '#0000FF';
      const BLUR_RASTER_SCALE = 0.42;
      const SCALAR_SMOOTH_RADIUS = 4;
      const SCALAR_SMOOTH_SIGMA = 1.2;

      const canvas = document.querySelector('#field');
      const ctx = canvas.getContext('2d', { alpha: false });
      const precipitationCanvas = document.createElement('canvas');
      const precipitationCtx = precipitationCanvas.getContext('2d', { alpha: true });
      const playPause = document.querySelector('#playPause');
      const renderModeToggle = document.querySelector('#renderModeToggle');
      const timeSlider = document.querySelector('#timeSlider');
      const zoomLabel = document.querySelector('#zoomLabel');
      const lodLabel = document.querySelector('#lodLabel');
      const resetZoom = document.querySelector('#resetZoom');

      const state = {
        playing: true,
        time: 0,
        zoom: 1,
        width: 1,
        height: 1,
        dpr: 1,
        lastFrame: performance.now(),
        scrubbing: false,
        renderMode: 'dots',
        lodLevel: null,
        desiredLOD: null,
        lodMorph: null
      };

      // ── Math and time interpolation ──────────────────────────────────────────
      const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
      const mix = (a, b, t) => a + (b - a) * t;
      const smoothstep = (a, b, x) => {
        const t = clamp((x - a) / (b - a));
        return t * t * (3 - 2 * t);
      };

      function periodicPulse(t, phase, width = 1) {
        return 0.5 + 0.5 * Math.sin((t + phase) * Math.PI * 2 * width);
      }

      function gaussian(x, y, cx, cy, sx, sy, rotation = 0) {
        const dx = x - cx;
        const dy = y - cy;
        const c = Math.cos(rotation);
        const s = Math.sin(rotation);
        const rx = dx * c + dy * s;
        const ry = -dx * s + dy * c;
        return Math.exp(-0.5 * ((rx * rx) / (sx * sx) + (ry * ry) / (sy * sy)));
      }

      function travelingGaussian(x, y, anchorX, offsetX, cy, sx, sy, rotation = 0) {
        return gaussian(x, y, anchorX + offsetX, cy, sx, sy, rotation);
      }

      // ── Intensity field generation ───────────────────────────────────────────
      // The field travels beneath the fixed sampling grid. Component offsets stay
      // locked together while amplitude, width, and rotation continue to evolve.
      // Add or tune Gaussian components here to change the weather shapes.
      function intensityAt(x, y, t, travelX) {
        // Safe empty-space rejection: beyond this support even the widest Gaussian
        // is far below every visible radius threshold. The fixed lattice remains unbounded.
        if (Math.abs(x - travelX) > 0.92 || Math.abs(y - 0.5) > 0.76) {
          return { rain: 0, storm: 0, hail: 0 };
        }

        const waveA = periodicPulse(t, 0.02);
        const waveB = periodicPulse(t, 0.36);
        const waveC = periodicPulse(t, 0.68);
        // A smooth loop envelope lets the system restart without a sharp
        // appearance/disappearance at the timeline seam.
        const lifecycle = smoothstep(0, 0.12, t) * smoothstep(0, 0.12, 1 - t);

        const rainA = travelingGaussian(x, y, travelX, -0.05, 0.47,
          mix(0.17, 0.25, waveA), mix(0.12, 0.18, waveB), mix(-0.35, 0.18, waveC));
        const rainB = travelingGaussian(x, y, travelX, 0.16, 0.39,
          mix(0.10, 0.18, waveB), mix(0.09, 0.14, waveA), 0.62);
        const rainC = travelingGaussian(x, y, travelX, -0.13, 0.66,
          mix(0.07, 0.14, waveC), mix(0.11, 0.18, waveA), -0.46);
        const rainNotch = travelingGaussian(x, y, travelX, 0.02, 0.54,
          mix(0.05, 0.12, waveB), mix(0.04, 0.09, waveB), 0.15);

        let rain = rainA * mix(0.72, 1.05, waveA)
          + rainB * mix(0.22, 0.76, waveB)
          + rainC * mix(0.18, 0.65, waveC)
          - rainNotch * mix(0.02, 0.26, waveB);

        const stormA = travelingGaussian(x, y, travelX, 0, 0.47,
          mix(0.075, 0.125, waveB), mix(0.055, 0.095, waveC), -0.25);
        const stormB = travelingGaussian(x, y, travelX, 0.13, 0.40,
          mix(0.045, 0.085, waveC), mix(0.04, 0.07, waveA), 0.65);
        const stormC = travelingGaussian(x, y, travelX, -0.11, 0.60,
          mix(0.04, 0.075, waveA), mix(0.045, 0.09, waveB), -0.5);
        let storm = stormA * mix(0.42, 1.0, waveB)
          + stormB * mix(0.18, 0.88, waveC)
          + stormC * mix(0.10, 0.67, waveA);

        const hailA = travelingGaussian(x, y, travelX, 0.025, 0.445,
          mix(0.028, 0.052, waveC), mix(0.024, 0.046, waveA), -0.2);
        const hailB = travelingGaussian(x, y, travelX, 0.125, 0.39,
          mix(0.018, 0.040, waveA), mix(0.020, 0.045, waveB), 0.7);
        const hailC = travelingGaussian(x, y, travelX, -0.08, 0.585,
          mix(0.017, 0.034, waveB), mix(0.021, 0.043, waveC), -0.3);
        let hail = hailA * mix(0.16, 0.95, waveC)
          + hailB * mix(0.04, 0.73, waveA)
          + hailC * mix(0.02, 0.55, waveB);

        // Fine, deterministic structure becomes visible only where precipitation exists.
        // Keep fine structure continuous as it passes through each fixed grid point.
        // A wrapped coordinate here would create a visible intensity discontinuity.
        const localX = x - travelX;
        const detail = 0.91
          + 0.045 * Math.sin(localX * 47 + Math.sin(y * 31))
          + 0.035 * Math.sin(y * 59 - localX * 17);
        rain *= detail * lifecycle;
        storm *= (0.96 + 0.045 * Math.sin(localX * 41 + y * 33)) * lifecycle;
        hail *= (0.97 + 0.035 * Math.sin(localX * 53 - y * 47)) * lifecycle;

        return {
          rain: clamp(rain),
          storm: clamp(storm),
          hail: clamp(hail)
        };
      }

      // ── LOD selection and aggregation / sampling ─────────────────────────────
      // LOD thresholds derive from target screen spacing. Negative levels sample
      // finer than the base grid; positive levels aggregate larger base-grid cells.
      function selectLOD(zoom, fieldPixels) {
        const baseCellPixels = fieldPixels * zoom / BASE_GRID;
        const continuous = Math.log2(TARGET_SPACING / Math.max(baseCellPixels, 0.001));
        return clamp(continuous, -2, 4);
      }

      function sampleField(x, y, t, lod, travelX) {
        if (lod <= 0) return intensityAt(x, y, t, travelX); // Continuous function acts as fine interpolation.

        const span = Math.pow(2, lod) / BASE_GRID;
        const offsets = [-0.34, 0, 0.34];
        let rain = 0;
        let stormAvg = 0;
        let hailAvg = 0;
        let stormMax = 0;
        let hailMax = 0;
        let count = 0;

        for (const oy of offsets) {
          for (const ox of offsets) {
            const v = intensityAt(x + ox * span, y + oy * span, t, travelX);
            rain += v.rain;
            stormAvg += v.storm;
            hailAvg += v.hail;
            stormMax = Math.max(stormMax, v.storm);
            hailMax = Math.max(hailMax, v.hail);
            count++;
          }
        }

        // Aggregation rules: average rain; max-biased blend for storm and hail.
        return {
          rain: rain / count,
          storm: mix(stormAvg / count, stormMax, 0.58),
          hail: mix(hailAvg / count, hailMax, 0.72)
        };
      }

      // ── Rendering ─────────────────────────────────────────────────────────────
      function resizeCanvas() {
        state.dpr = window.devicePixelRatio || 1;
        state.width = Math.max(1, window.innerWidth);
        state.height = Math.max(1, window.innerHeight);
        canvas.style.width = `${state.width}px`;
        canvas.style.height = `${state.height}px`;
        canvas.width = Math.round(state.width * state.dpr);
        canvas.height = Math.round(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      function getVisibleWorldBounds(fieldPixels, centerX, centerY) {
        const scale = fieldPixels * state.zoom;
        return {
          minX: 0.5 - centerX / scale,
          maxX: 0.5 + (state.width - centerX) / scale,
          minY: 0.5 - centerY / scale,
          maxY: 0.5 + (state.height - centerY) / scale
        };
      }

      function intensityToRadius(intensity, spacing, layer) {
        // Adjust thresholds and radius mapping here. Rain intentionally overlaps most.
        const thresholds = { rain: 0.045, storm: 0.075, hail: 0.11 };
        // Ease through the visibility floor instead of switching a dot on abruptly.
        const normalized = intensityToStrength(intensity, layer, thresholds);
        const overlap = layer === 'rain' ? 0.86 : layer === 'storm' ? 0.72 : 0.59;
        return spacing * overlap * Math.pow(normalized, layer === 'rain' ? 0.47 : 0.56);
      }

      function intensityToStrength(intensity, layer, thresholds = { rain: 0.045, storm: 0.075, hail: 0.11 }) {
        return smoothstep(thresholds[layer] * 0.45, 0.93, intensity);
      }

      function strongPrecipitationIntensity(rainIntensity) {
        return clamp((rainIntensity - RAIN_MODERATE_MAX) / (1 - RAIN_MODERATE_MAX));
      }

      function resolveHazardState(value) {
        const stormStrength = intensityToStrength(value.storm, 'storm');
        const hailStrength = intensityToStrength(value.hail, 'hail');
        if (hailStrength > 0) return 3 + Math.max(1, Math.ceil(hailStrength * 3));
        if (stormStrength > 0) return Math.max(1, Math.ceil(stormStrength * 3));
        return 0;
      }

      function hazardStateAppearance(value, hazardState, spacing) {
        if (hazardState <= 0) return { radius: 0, type: 'storm', color: '#FF00FF' };
        if (hazardState <= 3) {
          const strength = intensityToStrength(value.storm, 'storm');
          return {
            radius: spacing * mix(0.30, 0.72, Math.pow(strength, 0.47)),
            type: 'storm',
            color: '#FF00FF'
          };
        }

        const strength = intensityToStrength(value.hail, 'hail');
        return {
          radius: spacing * mix(0.34, 1.0, Math.pow(strength, 0.47)),
          type: 'hail',
          color: '#FFD400'
        };
      }

      function appendHazardPath(x, y, radius, type) {
        if (type === 'hail') {
          for (let point = 0; point < 6; point++) {
            const angle = -Math.PI / 2 + point * Math.PI / 3;
            const px = x + Math.cos(angle) * radius;
            const py = y + Math.sin(angle) * radius;
            if (point === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          return;
        }

        const innerRadius = radius * 0.38;
        for (let point = 0; point < 8; point++) {
          const angle = -Math.PI / 2 + point * Math.PI / 4;
          const pointRadius = point % 2 === 0 ? radius : innerRadius;
          const px = x + Math.cos(angle) * pointRadius;
          const py = y + Math.sin(angle) * pointRadius;
          if (point === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
      }

      function drawLayer(samples, key, color, spacing) {
        ctx.fillStyle = color;
        ctx.globalAlpha = 1;
        ctx.beginPath();
        for (const sample of samples) {
          const radius = intensityToRadius(sample.value[key], spacing, key);
          if (radius <= 0) continue;
          ctx.moveTo(sample.sx + radius, sample.sy);
          ctx.arc(sample.sx, sample.sy, radius, 0, Math.PI * 2);
        }
        ctx.fill();
      }

      function drawHazardLayer(samples, spacing) {
        ctx.globalAlpha = 1;
        for (const sample of samples) {
          const hazardState = resolveHazardState(sample.value);
          const appearance = hazardStateAppearance(sample.value, hazardState, spacing);
          if (appearance.radius <= 0) continue;
          ctx.fillStyle = appearance.color;
          ctx.beginPath();
          appendHazardPath(sample.sx, sample.sy, appearance.radius, appearance.type);
          ctx.fill();
        }
      }

      function drawStrongPrecipitationLayer(samples, spacing) {
        ctx.fillStyle = STRONG_PRECIPITATION_BLUE;
        ctx.globalAlpha = 1;
        ctx.beginPath();
        for (const sample of samples) {
          const intensity = strongPrecipitationIntensity(sample.value.rain);
          const radius = intensityToRadius(intensity, spacing, 'rain');
          if (radius <= 0) continue;
          ctx.moveTo(sample.sx + radius, sample.sy);
          ctx.arc(sample.sx, sample.sy, radius, 0, Math.PI * 2);
        }
        ctx.fill();
      }

      // Blur modes reconstruct continuous fields from fixed base-grid samples.
      // Smoothing happens on scalar intensities before any color is applied; this
      // is intentionally independent from the marker-rendering canvas output.
      function gaussianKernel(radius, sigma) {
        const kernel = new Float32Array(radius * 2 + 1);
        let sum = 0;
        for (let i = -radius; i <= radius; i++) {
          const weight = Math.exp(-(i * i) / (2 * sigma * sigma));
          kernel[i + radius] = weight;
          sum += weight;
        }
        for (let i = 0; i < kernel.length; i++) kernel[i] /= sum;
        return kernel;
      }

      const scalarSmoothKernel = gaussianKernel(SCALAR_SMOOTH_RADIUS, SCALAR_SMOOTH_SIGMA);

      function smoothScalarGrid(source, width, height) {
        const horizontal = new Float32Array(source.length);
        const smoothed = new Float32Array(source.length);

        for (let row = 0; row < height; row++) {
          const offset = row * width;
          for (let column = 0; column < width; column++) {
            let value = 0;
            for (let k = -SCALAR_SMOOTH_RADIUS; k <= SCALAR_SMOOTH_RADIUS; k++) {
              const sampleColumn = clamp(column + k, 0, width - 1);
              value += source[offset + sampleColumn] * scalarSmoothKernel[k + SCALAR_SMOOTH_RADIUS];
            }
            horizontal[offset + column] = value;
          }
        }

        for (let row = 0; row < height; row++) {
          const offset = row * width;
          for (let column = 0; column < width; column++) {
            let value = 0;
            for (let k = -SCALAR_SMOOTH_RADIUS; k <= SCALAR_SMOOTH_RADIUS; k++) {
              const sampleRow = clamp(row + k, 0, height - 1);
              value += horizontal[sampleRow * width + column] * scalarSmoothKernel[k + SCALAR_SMOOTH_RADIUS];
            }
            smoothed[offset + column] = value;
          }
        }

        return smoothed;
      }

      function buildSmoothedWeatherGrid(bounds, t, travelX) {
        const step = 1 / BASE_GRID;
        const padding = SCALAR_SMOOTH_RADIUS + 3;
        // intensityAt has compact empty-space rejection. Intersecting the visible
        // world with that support prevents very low zooms from allocating a huge
        // all-zero lattice while retaining enough padding for both filters.
        const minX = Math.max(bounds.minX, travelX - 0.92);
        const maxX = Math.min(bounds.maxX, travelX + 0.92);
        const minY = Math.max(bounds.minY, -0.26);
        const maxY = Math.min(bounds.maxY, 1.26);
        const startI = Math.floor(minX / step - 0.5) - padding;
        const endI = Math.ceil(maxX / step - 0.5) + padding;
        const startJ = Math.floor(minY / step - 0.5) - padding;
        const endJ = Math.ceil(maxY / step - 0.5) + padding;
        const width = endI - startI + 1;
        const height = endJ - startJ + 1;
        const rainSource = new Float32Array(width * height);
        const stormSource = new Float32Array(rainSource.length);
        const hailSource = new Float32Array(rainSource.length);

        for (let row = 0; row < height; row++) {
          const y = (startJ + row + 0.5) * step;
          const offset = row * width;
          for (let column = 0; column < width; column++) {
            const x = (startI + column + 0.5) * step;
            const value = intensityAt(x, y, t, travelX);
            const index = offset + column;
            rainSource[index] = value.rain;
            stormSource[index] = value.storm;
            hailSource[index] = value.hail;
          }
        }

        return {
          rain: smoothScalarGrid(rainSource, width, height),
          storm: smoothScalarGrid(stormSource, width, height),
          hail: smoothScalarGrid(hailSource, width, height),
          width,
          height,
          startI,
          startJ,
          step
        };
      }

      function cubicBSplineWeights(t) {
        const t2 = t * t;
        const t3 = t2 * t;
        const mt = 1 - t;
        return [
          mt * mt * mt / 6,
          (3 * t3 - 6 * t2 + 4) / 6,
          (-3 * t3 + 3 * t2 + 3 * t + 1) / 6,
          t3 / 6
        ];
      }

      function prepareSplineAxis(length, screenLength, center, scale, gridStart, step) {
        const indices = new Int32Array(length);
        const weights = new Float32Array(length * 4);
        for (let pixel = 0; pixel < length; pixel++) {
          const screenPosition = (pixel + 0.5) / length * screenLength;
          const world = 0.5 + (screenPosition - center) / scale;
          const gridPosition = world / step - 0.5 - gridStart;
          const base = Math.floor(gridPosition);
          indices[pixel] = base - 1;
          weights.set(cubicBSplineWeights(gridPosition - base), pixel * 4);
        }
        return { indices, weights };
      }

      function compositeField(color, opacity, pixel) {
        if (opacity <= 0) return pixel;
        const outputAlpha = opacity + pixel.a * (1 - opacity);
        return {
          r: (color[0] * opacity + pixel.r * pixel.a * (1 - opacity)) / outputAlpha,
          g: (color[1] * opacity + pixel.g * pixel.a * (1 - opacity)) / outputAlpha,
          b: (color[2] * opacity + pixel.b * pixel.a * (1 - opacity)) / outputAlpha,
          a: outputAlpha
        };
      }

      function renderBlurredFields(t, travelX, fieldPixels, centerX, centerY) {
        const bounds = getVisibleWorldBounds(fieldPixels, centerX, centerY);
        const grid = buildSmoothedWeatherGrid(bounds, t, travelX);
        const rasterWidth = Math.max(1, Math.ceil(state.width * BLUR_RASTER_SCALE));
        const rasterHeight = Math.max(1, Math.ceil(state.height * BLUR_RASTER_SCALE));
        if (precipitationCanvas.width !== rasterWidth || precipitationCanvas.height !== rasterHeight) {
          precipitationCanvas.width = rasterWidth;
          precipitationCanvas.height = rasterHeight;
        }

        const worldScale = fieldPixels * state.zoom;
        const xSpline = prepareSplineAxis(rasterWidth, state.width, centerX, worldScale, grid.startI, grid.step);
        const ySpline = prepareSplineAxis(rasterHeight, state.height, centerY, worldScale, grid.startJ, grid.step);
        const image = precipitationCtx.createImageData(rasterWidth, rasterHeight);
        const pixels = image.data;

        for (let py = 0; py < rasterHeight; py++) {
          const gridY = ySpline.indices[py];
          const wyOffset = py * 4;
          for (let px = 0; px < rasterWidth; px++) {
            const gridX = xSpline.indices[px];
            const wxOffset = px * 4;
            let rain = 0;
            let storm = 0;
            let hail = 0;

            for (let ky = 0; ky < 4; ky++) {
              const sampleY = clamp(gridY + ky, 0, grid.height - 1);
              const rowOffset = sampleY * grid.width;
              let rainRow = 0;
              let stormRow = 0;
              let hailRow = 0;
              for (let kx = 0; kx < 4; kx++) {
                const sampleX = clamp(gridX + kx, 0, grid.width - 1);
                const sampleIndex = rowOffset + sampleX;
                const weight = xSpline.weights[wxOffset + kx];
                rainRow += grid.rain[sampleIndex] * weight;
                stormRow += grid.storm[sampleIndex] * weight;
                hailRow += grid.hail[sampleIndex] * weight;
              }
              const yWeight = ySpline.weights[wyOffset + ky];
              rain += rainRow * yWeight;
              storm += stormRow * yWeight;
              hail += hailRow * yWeight;
            }

            // The alpha ramp supplies the soft support edge. Color follows the
            // same moderate/strong blue hierarchy as the dot renderer.
            const rainOpacity = smoothstep(0.008, 0.58, rain);
            const strong = smoothstep(RAIN_MODERATE_MAX, 0.9, rain);
            let pixel = { r: 0, g: mix(144, 0, strong), b: 255, a: rainOpacity };
            pixel = compositeField([255, 0, 255], smoothstep(0.012, 0.72, storm), pixel);
            pixel = compositeField([255, 212, 0], smoothstep(0.018, 0.62, hail), pixel);
            const pixelOffset = (py * rasterWidth + px) * 4;
            pixels[pixelOffset] = Math.round(pixel.r);
            pixels[pixelOffset + 1] = Math.round(pixel.g);
            pixels[pixelOffset + 2] = Math.round(pixel.b);
            pixels[pixelOffset + 3] = Math.round(pixel.a * 255);
          }
        }

        precipitationCtx.putImageData(image, 0, 0);
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(precipitationCanvas, 0, 0, state.width, state.height);
        ctx.restore();
      }

      function renderLOD(lod, t, travelX, fieldPixels, centerX, centerY) {
        const step = Math.pow(2, lod) / BASE_GRID;
        const spacing = step * fieldPixels * state.zoom;
        const bounds = getVisibleWorldBounds(fieldPixels, centerX, centerY);

        // The lattice is unbounded and anchored to world origin; only the browser clips it.
        const startI = Math.floor(bounds.minX / step) - GRID_OVERSCAN_CELLS;
        const endI = Math.ceil(bounds.maxX / step) + GRID_OVERSCAN_CELLS;
        const startJ = Math.floor(bounds.minY / step) - GRID_OVERSCAN_CELLS;
        const endJ = Math.ceil(bounds.maxY / step) + GRID_OVERSCAN_CELLS;
        const samples = [];

        for (let j = startJ; j < endJ; j++) {
          const y = (j + 0.5) * step;
          for (let i = startI; i < endI; i++) {
            const x = (i + 0.5) * step;
            const sx = centerX + (x - 0.5) * fieldPixels * state.zoom;
            const sy = centerY + (y - 0.5) * fieldPixels * state.zoom;
            samples.push({ sx, sy, value: sampleField(x, y, t, lod, travelX) });
          }
        }

        // Required order: rain → strong precipitation → composite hazard.
        drawLayer(samples, 'rain', RAIN_BLUE, spacing);
        drawStrongPrecipitationLayer(samples, spacing);
        drawHazardLayer(samples, spacing);
      }

      function updateLODTransition(delta, desiredLOD) {
        state.desiredLOD = desiredLOD;

        if (state.lodLevel === null) {
          state.lodLevel = desiredLOD;
          return;
        }

        if (!state.lodMorph && desiredLOD !== state.lodLevel) {
          if (desiredLOD < state.lodLevel) {
            state.lodMorph = {
              coarse: state.lodLevel,
              fine: state.lodLevel - 1,
              progress: 0,
              direction: 1
            };
          } else {
            state.lodMorph = {
              coarse: state.lodLevel + 1,
              fine: state.lodLevel,
              progress: 1,
              direction: -1
            };
          }
        }

        const morph = state.lodMorph;
        if (!morph) return;

        // Reversing zoom reverses the exact same parent/child geometry in place.
        if (desiredLOD <= morph.fine) morph.direction = 1;
        else if (desiredLOD >= morph.coarse) morph.direction = -1;

        morph.progress += morph.direction * delta / LOD_MORPH_SECONDS;
        if (morph.progress >= 1) {
          state.lodLevel = morph.fine;
          state.lodMorph = null;
        } else if (morph.progress <= 0) {
          state.lodLevel = morph.coarse;
          state.lodMorph = null;
        }
      }

      function drawMorphLayer(samples, key, color, coarseSpacing, fineSpacing, progress) {
        ctx.fillStyle = color;
        ctx.globalAlpha = 1;
        ctx.beginPath();

        for (const sample of samples) {
          const parentRadius = intensityToRadius(sample.parentValue[key], coarseSpacing, key);
          const childRadius = intensityToRadius(sample.childValue[key], fineSpacing, key);
          const radius = mix(parentRadius, childRadius, progress);
          if (radius <= 0) continue;

          const x = mix(sample.parentSx, sample.childSx, progress);
          const y = mix(sample.parentSy, sample.childSy, progress);
          ctx.moveTo(x + radius, y);
          ctx.arc(x, y, radius, 0, Math.PI * 2);
        }

        ctx.fill();
      }

      function drawHazardMorph(samples, coarseSpacing, fineSpacing, progress) {
        ctx.globalAlpha = 1;
        for (const sample of samples) {
          const hazardState = resolveHazardState(sample.childValue);
          const parent = hazardStateAppearance(sample.childValue, hazardState, coarseSpacing);
          const child = hazardStateAppearance(sample.childValue, hazardState, fineSpacing);
          const radius = mix(parent.radius, child.radius, progress);
          if (radius <= 0) continue;

          const x = mix(sample.parentSx, sample.childSx, progress);
          const y = mix(sample.parentSy, sample.childSy, progress);
          ctx.fillStyle = child.color;
          ctx.beginPath();
          appendHazardPath(x, y, radius, child.type);
          ctx.fill();
        }
      }

      function drawStrongPrecipitationMorph(samples, coarseSpacing, fineSpacing, progress) {
        ctx.fillStyle = STRONG_PRECIPITATION_BLUE;
        ctx.globalAlpha = 1;
        ctx.beginPath();

        for (const sample of samples) {
          const parentIntensity = strongPrecipitationIntensity(sample.parentValue.rain);
          const childIntensity = strongPrecipitationIntensity(sample.childValue.rain);
          const parentRadius = intensityToRadius(parentIntensity, coarseSpacing, 'rain');
          const childRadius = intensityToRadius(childIntensity, fineSpacing, 'rain');
          const radius = mix(parentRadius, childRadius, progress);
          if (radius <= 0) continue;

          const x = mix(sample.parentSx, sample.childSx, progress);
          const y = mix(sample.parentSy, sample.childSy, progress);
          ctx.moveTo(x + radius, y);
          ctx.arc(x, y, radius, 0, Math.PI * 2);
        }

        ctx.fill();
      }

      function renderLODMorph(morph, t, travelX, fieldPixels, centerX, centerY) {
        const fineStep = Math.pow(2, morph.fine) / BASE_GRID;
        const coarseStep = fineStep * 2;
        const fineSpacing = fineStep * fieldPixels * state.zoom;
        const coarseSpacing = coarseStep * fieldPixels * state.zoom;
        const bounds = getVisibleWorldBounds(fieldPixels, centerX, centerY);
        const startI = Math.floor(bounds.minX / fineStep) - GRID_OVERSCAN_CELLS * 2;
        const endI = Math.ceil(bounds.maxX / fineStep) + GRID_OVERSCAN_CELLS * 2;
        const startJ = Math.floor(bounds.minY / fineStep) - GRID_OVERSCAN_CELLS * 2;
        const endJ = Math.ceil(bounds.maxY / fineStep) + GRID_OVERSCAN_CELLS * 2;
        const samples = [];

        for (let j = startJ; j < endJ; j++) {
          const childY = (j + 0.5) * fineStep;
          const parentJ = Math.floor(j / 2);
          const parentY = (parentJ + 0.5) * coarseStep;

          for (let i = startI; i < endI; i++) {
            const childX = (i + 0.5) * fineStep;
            const parentI = Math.floor(i / 2);
            const parentX = (parentI + 0.5) * coarseStep;
            samples.push({
              childSx: centerX + (childX - 0.5) * fieldPixels * state.zoom,
              childSy: centerY + (childY - 0.5) * fieldPixels * state.zoom,
              parentSx: centerX + (parentX - 0.5) * fieldPixels * state.zoom,
              parentSy: centerY + (parentY - 0.5) * fieldPixels * state.zoom,
              childValue: sampleField(childX, childY, t, morph.fine, travelX),
              parentValue: sampleField(parentX, parentY, t, morph.coarse, travelX)
            });
          }
        }

        const progress = smoothstep(0, 1, clamp(morph.progress));
        // Required order remains rain → strong precipitation → composite hazard.
        drawMorphLayer(samples, 'rain', RAIN_BLUE, coarseSpacing, fineSpacing, progress);
        drawStrongPrecipitationMorph(samples, coarseSpacing, fineSpacing, progress);
        drawHazardMorph(samples, coarseSpacing, fineSpacing, progress);
      }

      function render(delta) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#080b12';
        ctx.fillRect(0, 0, state.width, state.height);

        const fieldPixels = Math.min(state.width, state.height) * 0.92;
        const centerX = state.width / 2;
        const centerY = state.height / 2 - Math.min(24, state.height * 0.025);
        const continuousLOD = selectLOD(state.zoom, fieldPixels);
        const desiredLOD = Math.round(continuousLOD);
        const t = state.time / LOOP_SECONDS;
        const bounds = getVisibleWorldBounds(fieldPixels, centerX, centerY);
        // Keep the synchronized system in the middle third of the viewport.
        const travelProgress = smoothstep(0, 1, t);
        const travelX = mix(
          mix(bounds.minX, bounds.maxX, 0.33),
          mix(bounds.minX, bounds.maxX, 0.67),
          travelProgress
        );

        updateLODTransition(delta, desiredLOD);
        if (state.renderMode === 'blur') {
          renderBlurredFields(t, travelX, fieldPixels, centerX, centerY);
        } else if (state.lodMorph) {
          renderLODMorph(state.lodMorph, t, travelX, fieldPixels, centerX, centerY);
        } else {
          renderLOD(state.lodLevel, t, travelX, fieldPixels, centerX, centerY);
        }

        ctx.globalAlpha = 1;
        zoomLabel.textContent = `${state.zoom.toFixed(2)}×`;
        lodLabel.textContent = state.lodMorph
          ? `${state.lodMorph.coarse}→${state.lodMorph.fine}`
          : String(state.lodLevel);
        if (!state.scrubbing) timeSlider.value = String(Math.round(state.time / LOOP_SECONDS * 1000));
      }

      function frame(now) {
        const delta = Math.min((now - state.lastFrame) / 1000, 0.1);
        state.lastFrame = now;
        if (state.playing && !state.scrubbing) state.time = (state.time + delta) % LOOP_SECONDS;
        render(delta);
        requestAnimationFrame(frame);
      }

      // ── Player controls ───────────────────────────────────────────────────────
      playPause.addEventListener('click', () => {
        state.playing = !state.playing;
        playPause.dataset.state = state.playing ? 'playing' : 'paused';
        playPause.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
      });

      renderModeToggle.addEventListener('click', () => {
        state.renderMode = state.renderMode === 'dots' ? 'blur' : 'dots';
        renderModeToggle.setAttribute('aria-pressed', String(state.renderMode === 'blur'));
      });

      timeSlider.addEventListener('pointerdown', () => { state.scrubbing = true; });
      timeSlider.addEventListener('input', () => {
        state.time = Number(timeSlider.value) / 1000 * LOOP_SECONDS;
      });
      const endScrub = () => { state.scrubbing = false; };
      timeSlider.addEventListener('pointerup', endScrub);
      timeSlider.addEventListener('pointercancel', endScrub);

      // ── Zoom controls ─────────────────────────────────────────────────────────
      function setZoom(next) {
        state.zoom = clamp(next, MIN_ZOOM, MAX_ZOOM);
        resetZoom.hidden = state.zoom.toFixed(2) === '1.00';
      }

      document.querySelector('#zoomIn').addEventListener('click', () => setZoom(state.zoom * 1.28));
      document.querySelector('#zoomOut').addEventListener('click', () => setZoom(state.zoom / 1.28));
      resetZoom.addEventListener('click', () => setZoom(1));
      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        setZoom(state.zoom * Math.exp(-event.deltaY * 0.00125));
      }, { passive: false });

      let pinchStartDistance = 0;
      let pinchStartZoom = state.zoom;

      function touchDistance(touches) {
        return Math.hypot(
          touches[1].clientX - touches[0].clientX,
          touches[1].clientY - touches[0].clientY
        );
      }

      canvas.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 2) return;
        event.preventDefault();
        pinchStartDistance = touchDistance(event.touches);
        pinchStartZoom = state.zoom;
      }, { passive: false });

      canvas.addEventListener('touchmove', (event) => {
        if (event.touches.length !== 2 || pinchStartDistance <= 0) return;
        event.preventDefault();
        setZoom(pinchStartZoom * touchDistance(event.touches) / pinchStartDistance);
      }, { passive: false });

      const endPinch = (event) => {
        if (event.touches.length < 2) pinchStartDistance = 0;
      };
      canvas.addEventListener('touchend', endPinch, { passive: true });
      canvas.addEventListener('touchcancel', endPinch, { passive: true });

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
