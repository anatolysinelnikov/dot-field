<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geographic weather dots</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="playground">
    <div id="map" aria-label="Interactive geographic weather map"></div>

    <div class="legend" aria-hidden="true">
      <span class="rain"><i class="rain-base"></i><i class="rain-strong"></i>Rain</span>
      <span class="storm"><i></i>Thunderstorm</span>
      <span class="hail"><i></i>Hail</span>
    </div>

    <div id="projectionSelector" class="projection-control" role="radiogroup" aria-label="Map projection" data-projection="globe">
      <button type="button" role="radio" aria-checked="true" data-projection="globe">Globe</button>
      <button type="button" role="radio" aria-checked="false" data-projection="mercator">Mercator</button>
    </div>

    <div class="readout" aria-live="polite">
      <span>zoom <b id="zoomLabel">–</b></span>
      <span>LOD <b id="lodLabel">–</b></span>
      <span>samples <b id="sampleLabel">0</b></span>
    </div>

    <section class="controls" aria-label="Playback and timeline controls">
      <button id="playPause" type="button" data-state="playing" aria-label="Pause"></button>
      <label class="time-control">
        <input id="timeSlider" type="range" min="0" max="1" step="any" value="0" aria-label="Animation time">
      </label>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
